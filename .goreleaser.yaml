version: 2
project_name: lgb

before:
  hooks:
    - sh -c "cd frontend && npm ci && npm run build"

builds:
  - id: lgb
    main: ./cmd/lgb
    binary: lgb
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/fgjcarlos/lgb/internal/version.Version={{.Version}}
      - -X github.com/fgjcarlos/lgb/internal/version.Commit={{.Commit}}
      - -X github.com/fgjcarlos/lgb/internal/version.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
