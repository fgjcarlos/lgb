# docker-compose.dev.yml — development stack for LGB.
#
# Services:
#   gateway  — LGB binary (live-reload via air on golang:1.24-alpine)
#   plcsim   — deterministic CIP PLC simulator (gologix, port 44818)
#   mqtt     — Eclipse Mosquitto MQTT broker (port 1883)
#
# Usage (fix for #65 — onboarding in 4 steps):
#   1. `cp docker/.env.dev.example docker/.env.dev`
#   2. `cd frontend && npm ci && npm run build && cd -`
#        (gateway go:embeds frontend/dist — without this step /  returns 404)
#   3. Fill in LGB_AUTH_JWTSECRET in docker/.env.dev (openssl rand -hex 32)
#   4. `docker compose -f docker-compose.dev.yml up`
#
# Resetting the admin wizard:
#   `docker compose -f docker-compose.dev.yml down -v`
#   removes the lgb-data volume so the next `up` recreates users.db empty and
#   EnsureAdminExists seeds the user from LGB_AUTH_ADMIN_* env vars.
#
# Requirements: MVP-FND-9.1, MVP-FND-9.3. Design: §13.1.

services:

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    depends_on:
      plcsim:
        condition: service_healthy
      mqtt:
        condition: service_started
    volumes:
      - ./:/workspace
      - lgb-data:/var/lib/lgb
    ports:
      - "8080:8080"
    environment:
      # JWT signing key. Required — exported from docker/.env.dev.
      LGB_AUTH_JWTSECRET: ${LGB_AUTH_JWTSECRET:?LGB_AUTH_JWTSECRET must be set — see docker/.env.dev.example}
      # First-run admin bootstrap. Defaults are dev-only and overridable in
      # docker/.env.dev. NEVER use `changeme-dev` outside the dev stack.
      LGB_AUTH_ADMIN_USER: ${LGB_AUTH_ADMIN_USER:-admin}
      LGB_AUTH_ADMIN_PASSWORD: ${LGB_AUTH_ADMIN_PASSWORD:-changeme-dev}
    networks:
      - lgb-dev
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  plcsim:
    build:
      context: .
      dockerfile: docker/Dockerfile.plcsim
    ports:
      - "44818:44818"
    networks:
      - lgb-dev
    healthcheck:
      # TCP probe — verifies the CIP port is accepting connections.
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/44818 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    networks:
      - lgb-dev

volumes:
  lgb-data:

networks:
  lgb-dev: