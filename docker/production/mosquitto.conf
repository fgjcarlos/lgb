per_listener_settings true
listener 8883
protocol mqtt
allow_anonymous false
password_file /run/mqtt-credentials/passwd
acl_file /mosquitto/config/acl
cafile /run/mqtt-certs/ca.crt
certfile /run/mqtt-certs/broker.crt
keyfile /run/mqtt-certs/broker.key
require_certificate false
persistence true
persistence_location /mosquitto/data/
